# Config for Reddit Climate Random
port: 8946
server_name: localhost
task_name: "Negative Citation Annotation"
annotation_task_name: "Negative Citation Annotation"

# Task directory (current directory)
task_dir: "."
site_dir: "templates"
# Data configuration
data_files:
  - "data/annotation_data.json"

item_properties:
  id_key: id
  text_key: text
  kwargs:
    - paper_title
    - paper_abstract
    - paper_url

# Output configuration
output_annotation_dir: "output/"
output_annotation_format: "json"

# Annotation scheme
annotation_schemes:
  - annotation_type: radio
    name: stance
    description: "What is the stance?"
    labels:
      - Negative Citation
      - Non-Negative Citation
      - Uncertain
    sequential_key_binding: true
    horizontal: true

# Allow anyone to annotate
allow_all_users: true

# Prolific integration
login:
  type: prolific  # Enables both URL-direct login and API integration

prolific:
  config_file_path: configs/prolific_config.yaml

completion_code: "C1MDU4LQ"
training_failed_completion_code: "C1QI5RLY"

# Automatic task assignment for crowdsourcing
assignment_strategy: random
random_seed: 0
max_annotations_per_user: 60
max_annotations_per_item: 3

jumping_to_id_disabled: true
hide_navbar: true

phases:
  order:
  - welcome
  - instructions
  - training
  - annotation
  welcome:
    type: instructions
    file: "potato/templates/welcome.html"
  instructions:
    type: instructions
    file: "potato/templates/instructions.html"
  training:
    type: training
    task_layout: "layouts/task_layout.html"
  annotation:
    type: annotation
    task_layout: "layouts/task_layout.html"

training:
  enabled: true
  data_file: "data/training_data.json"
  annotation_schemes: ["stance", "comment"]
  passing_criteria:
    min_correct: 10
    require_all_correct: true
    max_mistakes: 5
  allow_retry: true
  failure_action: "move_to_done"  # or "advance"

n_train_items: 10
n_items_to_annotate: 60
n_attention_checks: 6
coin_to_money: "£0.5"


attention_checks:
  enabled: true

  # Path to JSON file containing attention check items
  items_file: "data/gold_data.json"

  # How often to inject attention checks
  # probability: 0.1
  frequency: 10

  # Flag suspiciously fast responses
  min_response_time: 3.0